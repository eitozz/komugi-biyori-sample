<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#28362b">
  <title>採用情報 | こむぎ日和</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="recruit-page">
  <header class="header">
    <a class="brand" href="./" aria-label="こむぎ日和 ホーム">
      <span class="brand-symbol" aria-hidden="true">こ</span>
      <span><span class="brand-name">こむぎ日和</span><span class="brand-sub">パンと暮らす</span></span>
    </a>
    <a class="recruit-home" href="./">トップページへ</a>
  </header>
  <main>
    <div class="recruit-banner">
      <div class="section-wrap">
        <h1>採用情報</h1>
        <p class="demo-note">募集要項の掲載例です</p>
      </div>
    </div>
    <section class="recruit section-wrap" aria-labelledby="recruit-role">
      <div>
        <h2 id="recruit-role">販売スタッフ</h2>
        <p class="recruit-intro">パンを並べたり、お客さまにおすすめを伝えたり。朝のお店を一緒に支える販売スタッフの募集例です。</p>
      </div>
      <div>
        <dl class="shop-info">
          <div><dt>職種</dt><dd>販売スタッフ（アルバイト）</dd></div>
          <div><dt>仕事内容</dt><dd>接客、レジ、パンの品出し</dd></div>
          <div><dt>勤務時間</dt><dd>8:00〜13:00、週2日から</dd></div>
          <div><dt>応募方法</dt><dd>お問い合わせの種別で「採用について」を選択</dd></div>
        </dl>
        <a class="recruit-link" href="./#contact">お問い合わせ <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
  <footer class="footer">
    <a class="footer-brand" href="./">こむぎ日和</a>
    <div class="footer-bottom"><p>ココナラ掲載用 Web制作サンプル</p></div>
  </footer>
</body>
</html>
